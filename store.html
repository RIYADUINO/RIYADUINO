<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RIYADUINO | Professional Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&family=IBM+Plex+Sans+Arabic:wght@300;400;700&family=Readex+Pro:wght@300;400;600&family=Changa:wght@500;700;800&family=Syne:wght@700;800&family=Cairo:wght@600;800&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        :root {
            --bg-deep: #050505;
            --bg-panel: #0E0E0E;
            --gold-primary: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --text-white: #ffffff;
            --text-grey: #b0b0b0;
            --border-tech: 1px solid rgba(255, 255, 255, 0.15);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-arabic-body: 'IBM Plex Sans Arabic', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-deep); color: var(--text-white); 
            font-family: var(--font-main); overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        body.ar { direction: rtl; text-align: right; }
        body.ar * { font-family: var(--font-arabic-body) !important; }

        body.ar h1, body.ar h2, body.ar h3, body.ar .logo, body.ar .p-price, 
        body.ar .filter-btn, body.ar .btn-gold, 
        body.ar .notify-toast, body.ar .badge, body.ar .google-auth-btn {
            font-family: var(--font-arabic-body) !important; 
            font-weight: 700 !important; letter-spacing: 0 !important; 
        }

        body.ar .sidebar-panel { margin-left: 0; margin-right: auto; border-left: none; border-right: 1px solid #222; }
        body.ar input, body.ar input::placeholder, body.ar textarea::placeholder { font-family: var(--font-arabic-body) !important; }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideInLeft { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes glowPulse { 0% { box-shadow: 0 0 5px var(--gold-primary); } 50% { box-shadow: 0 0 20px var(--gold-primary); } 100% { box-shadow: 0 0 5px var(--gold-primary); } }

        #particle-canvas {
            position: fixed; top: 0; left: 0; pointer-events: none;
            z-index: 9999; width: 100%; height: 100%;
        }

        #notification-area {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 5000; display: flex; flex-direction: column; gap: 10px;
            pointer-events: none; width: 90%; max-width: 400px;
        }
        .notify-toast {
            background: rgba(14, 14, 14, 0.98); border: 1px solid var(--gold-primary);
            color: #fff; padding: 12px 15px; border-radius: 8px; font-family: var(--font-tech);
            font-size: 0.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: slideDown 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto; line-height: 1.4; border-left: 4px solid var(--gold-primary);
        }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        nav {
            position: sticky; top: 0; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(12px);
            border-bottom: var(--border-tech); padding: 12px 4%;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .logo { font-family: var(--font-tech); font-weight: 800; font-size: 1.4rem; color: #fff; text-decoration: none; white-space: nowrap; }
        .logo span { color: var(--gold-primary); text-shadow: 0 0 10px var(--gold-glow); }
        .nav-links { display: flex; align-items: center; gap: 12px; }

        /* --- COOL AUTH BUTTON --- */
        .google-auth-btn {
            display: flex; align-items: center; gap: 8px; 
            background: linear-gradient(135deg, #FFD700, #E5C100); 
            color: #000; border: none;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; 
            font-family: var(--font-tech); font-weight: 800; font-size: 0.75rem;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase; letter-spacing: 0.5px;
            position: relative; overflow: hidden; white-space: nowrap;
        }
        .google-auth-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transition: 0.5s;
        }
        .google-auth-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }
        .google-auth-btn:hover::before { left: 100%; }
        
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gold-primary); cursor: pointer; display: none; transition: 0.3s; object-fit: cover; }
        .user-avatar:hover { box-shadow: 0 0 15px var(--gold-primary); transform: scale(1.1); }

        .icon-btn { cursor: pointer; position: relative; color: #fff; transition: 0.2s; padding: 5px; }
        .icon-btn:hover { color: var(--gold-primary); transform: scale(1.1); }
        .badge { 
            position: absolute; top: -5px; right: -5px; background: var(--gold-primary); color: #000; 
            font-size: 0.6rem; font-weight: bold; padding: 1px 5px; border-radius: 10px;
            animation: zoomPop 0.3s ease; min-width: 16px; text-align: center;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 25px 4%; flex-grow: 1; width: 100%; }
        
        .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent; border: 1px solid #333; color: #888; padding: 8px 20px;
            font-family: var(--font-tech); font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.3s;
            font-size: 0.8rem;
        }
        .filter-btn:hover { border-color: #666; color: #fff; }
        .filter-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-primary); box-shadow: 0 0 15px var(--gold-glow); }

        /* RESPONSIVE GRID */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
        }

        .product-card {
            background: var(--bg-panel); border: var(--border-tech); border-radius: 12px; overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative;
            display: flex; flex-direction: column;
        }
        .product-card:hover { border-color: var(--gold-primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .img-box { height: 220px; background: #000; overflow: hidden; position: relative; width: 100%; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .product-card:hover .img-box img { transform: scale(1.1); }
        .p-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-title { font-weight: 600; font-size: 1rem; margin-bottom: 8px; line-height: 1.4; }
        .p-price { color: var(--gold-primary); font-family: var(--font-tech); font-weight: 700; font-size: 1.1rem; }

        /* OUT OF STOCK STYLING */
        .out-of-stock-card {
            filter: grayscale(1) opacity(0.7);
            pointer-events: none;
        }
        .out-of-stock-badge {
            position: absolute; top: 10px; right: 10px;
            background: #ff4444; color: white; padding: 4px 8px;
            font-weight: 900; font-family: var(--font-tech); font-size: 0.65rem;
            border-radius: 4px; z-index: 10;
        }

        /* --- INBOX STYLES --- */
        .msg-card {
            background: #111; border: 1px solid #222; padding: 15px;
            border-radius: 8px; margin-bottom: 15px; position: relative;
            transition: 0.3s; cursor: pointer; border-left: 3px solid #333;
        }
        .msg-card:hover { transform: translateX(5px); border-color: #444; }
        .msg-card.unread { 
            border-left: 3px solid var(--gold-primary); 
            background: linear-gradient(90deg, rgba(255,215,0,0.05), transparent);
        }
        .msg-card.unread::after {
            content: ''; position: absolute; top: 15px; right: 15px;
            width: 8px; height: 8px; background: var(--gold-primary);
            border-radius: 50%; box-shadow: 0 0 10px var(--gold-primary);
        }
        .msg-date { font-size: 0.65rem; color: #666; margin-bottom: 5px; font-family: var(--font-tech); }
        .msg-title { font-weight: 700; color: #eee; margin-bottom: 5px; font-size: 0.95rem; }
        .msg-body { font-size: 0.85rem; color: #aaa; line-height: 1.5; }
        .empty-inbox { text-align: center; padding: 40px; color: #444; font-style: italic; }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; transition: opacity 0.3s; padding: 20px;
        }
        .modal-overlay.open { display: flex; opacity: 1; }

        /* Animation when opening product modal */
        .modal-overlay.open .detail-modal { animation: zoomPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Animation when opening Sidebars */
        .modal-overlay.open .sidebar-panel { animation: slideInRight 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        body.ar .modal-overlay.open .sidebar-panel { animation: slideInLeft 0.4s cubic-bezier(0.23, 1, 0.32, 1); }

        .detail-modal { 
            background: #111; width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; 
            border: var(--border-tech); border-radius: 15px; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            max-height: 90vh;
        }
        .detail-content { padding: 30px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
        .quality-options { display: flex; gap: 10px; margin: 15px 0; }
        .q-opt { 
            flex: 1; padding: 10px; border: 1px solid #333; text-align: center; cursor: pointer; 
            border-radius: 6px; font-size: 0.8rem; color: #888; transition: 0.2s;
        }
        .q-opt.selected { border-color: var(--gold-primary); color: var(--gold-primary); background: rgba(255,215,0,0.1); box-shadow: 0 0 10px rgba(255,215,0,0.1); }

        .sidebar-panel { 
            background: #0a0a0a; width: 100%; max-width: 450px; height: 100%; margin-left: auto; 
            border-left: 1px solid #222; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,0.8);
        }
        .panel-header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .panel-content { flex-grow: 1; overflow-y: auto; padding: 20px; }

        .apply-btn { background: #222; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-size: 0.75rem; border-radius: 4px; transition: 0.2s; font-family: var(--font-tech); }
        .apply-btn:hover { background: #333; color: var(--gold-primary); }

        .cart-item { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; animation: fadeIn 0.3s ease; }
        .cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .qty-ctrl { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { background: #222; border: none; color: #fff; width: 25px; height: 25px; cursor: pointer; border-radius: 4px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: var(--gold-primary); color: #000; }
        
        .history-card { 
            background: #151515; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #222; 
            transition: 0.3s; animation: fadeIn 0.4s ease;
        }
        .history-card:hover { border-color: #444; transform: translateX(5px); }

        .history-date { font-size: 0.7rem; color: var(--gold-primary); font-family: var(--font-tech); margin-bottom: 5px; }
        .contact-info { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; font-size: 0.8rem; line-height: 1.5; color: #ccc; }
        .contact-info a { color: var(--gold-primary); text-decoration: none; border-bottom: 1px dotted var(--gold-primary); }

        #userPhone, .custom-input {
            width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; 
            border-radius: 6px; outline: none; transition: 0.3s; font-size: 1rem;
        }
        #userPhone:focus, .custom-input:focus { border-color: var(--gold-primary); }

        .btn-gold { 
            width: 100%; padding: 15px; background: var(--gold-primary); color: #000; border: none; 
            font-weight: 800; cursor: pointer; font-family: var(--font-tech); border-radius: 6px; transition: 0.2s;
            position: relative; overflow: hidden;
        }
        .btn-gold:hover { box-shadow: 0 0 20px rgba(255,215,0,0.4); transform: translateY(-2px); }

        /* Price Animation Classes */
        .old-price { color: #ff4444; text-decoration: line-through; font-size: 0.9em; margin-right: 10px; opacity: 0.8; }
        .new-price { color: #00ff00; font-weight: 900; animation: glowPulse 1s infinite; font-size: 1.2em; }

        /* Custom Project Form Styles */
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 6px; font-weight: bold; }
        .custom-textarea { min-height: 100px; resize: vertical; font-family: var(--font-main); }
        .radio-group { display: flex; gap: 10px; }
        .radio-label {
            flex: 1; background: #111; border: 1px solid #333; padding: 10px; text-align: center;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; color: #888;
        }
        .radio-label:hover { border-color: #555; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label {
            border-color: var(--gold-primary); background: rgba(255,215,0,0.1); color: var(--gold-primary);
        }

        /* --- MOBILE & RESPONSIVE TWEAKS --- */
        @media (max-width: 900px) {
            .detail-modal { grid-template-columns: 1fr; overflow-y: auto; display: flex; flex-direction: column; }
            #modalImg { width: 100%; height: 250px; object-fit: cover; }
            .detail-content { padding: 20px; }
        }

        @media (max-width: 768px) {
            .nav-links { gap: 8px; }
            .logo { font-size: 1.1rem; }
            .filter-btn { padding: 6px 12px; font-size: 0.7rem; }
            
            /* Better Grid for Mobile */
            .products-grid { 
                grid-template-columns: repeat(2, 1fr); /* Force 2 columns */
                gap: 12px; 
            }
            .img-box { height: 140px; }
            .p-info { padding: 12px; }
            .p-title { font-size: 0.85rem; }
            .p-price { font-size: 0.9rem; }
            
            /* Nav cleanup for mobile */
            #authText { display: none; } /* Hide Sign In Text */
            .google-auth-btn { padding: 8px; } /* Hide HOME text if inside span, but here it is direct text, see below */ /* Hack to hide text */ /* Replace with icon */
        }

        @media (max-width: 480px) {
            .container { padding: 15px 10px; }
            .sidebar-panel { width: 100%; max-width: 100%; }
            .modal-overlay { padding: 10px; }
            
            .logo span { display: none; } /* Only show RIYAD on very small screens to save space */
            .logo::after { content: 'UINO'; color: var(--gold-primary); }
            
            #notification-area { top: 70px; width: 95%; }
        }


        /* ===== v2: filters, low stock, smoother motion ===== */
        :root { --ease: cubic-bezier(.22, 1, .36, 1); --warn: #FFC400; }
        
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
        @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.97); } }
        @keyframes chipIn { from { opacity: 0; transform: translateY(8px); } }
        @keyframes ripple { to { transform: scale(1); opacity: 0; } }
        @keyframes bump { 40% { transform: scale(1.55); } }
        @keyframes dot { 50% { opacity: .25; scale: .55; } }

        /* modals & panels: real open/close transitions */
        .modal-overlay { display: flex; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s var(--ease), visibility 0s linear .4s; }
        .modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .4s var(--ease), visibility 0s; }
        .modal-overlay .sidebar-panel { transform: translateX(100%); transition: transform .55s var(--ease); }
        body.ar .modal-overlay .sidebar-panel { transform: translateX(-100%); }
        .modal-overlay.open .sidebar-panel, body.ar .modal-overlay.open .sidebar-panel { transform: none; animation: none; }
        .modal-overlay .detail-modal { transform: translateY(24px) scale(.94); opacity: 0; transition: transform .55s var(--ease), opacity .4s var(--ease); }
        .modal-overlay.open .detail-modal { transform: none; opacity: 1; animation: none; }
        .notify-toast { transition: opacity .4s var(--ease), transform .4s var(--ease); }
        .badge.bump { animation: bump .5s var(--ease); }

        /* ghost (transparent) buttons: soft pill */
        .ghost-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; color: #ddd; font-family: var(--font-tech); font-weight: 700; font-size: .72rem; letter-spacing: .08em; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: color .4s var(--ease), border-color .4s var(--ease), background .4s var(--ease), box-shadow .4s var(--ease), transform .4s var(--ease), scale .2s var(--ease); }
        .ghost-btn:hover { color: var(--gold-primary); border-color: rgba(255,215,0,.6); background: rgba(255,215,0,.1); box-shadow: 0 0 0 4px rgba(255,215,0,.07), 0 10px 26px -12px var(--gold-glow); transform: translateY(-2px); }
        .ghost-btn:active { scale: .95; }
        .icon-btn { transition: color .3s var(--ease), transform .4s var(--ease); }
        .google-auth-btn { border-radius: 999px; padding: 8px 18px; }
        .apply-btn { position: relative; overflow: hidden; border-radius: 999px; padding: 0 20px; transition: background .3s, color .3s, scale .2s var(--ease); }
        .apply-btn:active { scale: .95; }
        .q-opt, .radio-label { border-radius: 10px; transition: border-color .3s var(--ease), background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease); }
        .q-opt:hover, .radio-label:hover { transform: translateY(-2px); border-color: #666; }

        /* gold button: light sweep + press */
        .btn-gold { border-radius: 999px; transition: transform .4s var(--ease), box-shadow .4s var(--ease), scale .2s var(--ease), opacity .3s; }
        .btn-gold::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); translate: -120% 0; transition: translate .8s var(--ease); }
        .btn-gold:hover::before { translate: 120% 0; }
        .btn-gold:active { scale: .97; }
        .btn-gold:disabled { opacity: .6; pointer-events: none; }
        .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .22; transform: scale(0); animation: ripple .7s var(--ease) forwards; pointer-events: none; }

        /* toolbar */
        .toolbar { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; padding: 16px; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); animation: rise .8s var(--ease) backwards; }
        .toolbar-top, .toolbar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar-top { justify-content: space-between; }
        .seg { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; background: #0a0a0a; border: 1px solid #232323; }
        .seg-ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--gold-primary); box-shadow: 0 0 18px var(--gold-glow); transition: transform .55s var(--ease), width .55s var(--ease); }
        .seg-btn { position: relative; z-index: 1; overflow: hidden; border: 0; background: none; color: #8a8a8a; padding: 9px 24px; border-radius: 999px; cursor: pointer; font: 700 .78rem var(--font-tech); letter-spacing: .06em; transition: color .35s var(--ease); }
        .seg-btn:hover { color: #fff; }
        .seg-btn.active, .seg-btn.active:hover { color: #000; }
        .custom-cta { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(255,215,0,.5); background: rgba(255,215,0,.06); color: var(--gold-primary); font: 700 .78rem var(--font-tech); letter-spacing: .04em; cursor: pointer; transition: background .4s var(--ease), color .4s var(--ease), box-shadow .4s var(--ease), transform .4s var(--ease), scale .2s var(--ease); }
        .custom-cta svg { transition: transform .5s var(--ease); }
        .custom-cta:hover { background: var(--gold-primary); color: #000; box-shadow: 0 10px 30px -10px var(--gold-glow); transform: translateY(-2px); }
        .custom-cta:hover svg { transform: rotate(90deg); }
        .custom-cta:active { scale: .96; }

        .search { position: relative; flex: 1 1 260px; display: flex; align-items: center; }
        .search > svg { position: absolute; inset-inline-start: 16px; color: #777; pointer-events: none; transition: color .3s; }
        .search:focus-within > svg { color: var(--gold-primary); }
        .search input { width: 100%; padding: 12px 44px; background: #0a0a0a; border: 1px solid #262626; border-radius: 999px; color: #fff; font: 400 .9rem var(--font-main); outline: none; transition: border-color .3s, box-shadow .3s; }
        .search input:focus { border-color: var(--gold-primary); box-shadow: 0 0 0 4px rgba(255,215,0,.08); }

        .stock-toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #aaa; transition: transform .45s var(--ease), background .3s; }
        .stock-toggle.on { border-color: rgba(255,215,0,.6); color: var(--gold-primary); }
        .stock-toggle.on .sw { background: rgba(255,215,0,.25); }
        .stock-toggle.on .sw::after { transform: translateX(14px); background: var(--gold-primary); }

        .chip b { min-width: 22px; padding: 2px 6px; border-radius: 999px; background: #1a1a1a; color: #888; font-size: .68rem; font-weight: 700; text-align: center; transition: background .35s, color .35s; }
        .chip:hover { border-color: rgba(255,215,0,.5); color: #fff; transform: translateY(-1px); }
        .chip.active { background: var(--gold-primary); border-color: var(--gold-primary); color: #000; box-shadow: 0 6px 20px -8px var(--gold-glow); }
        .chip.active b { background: rgba(0,0,0,.15); color: #000; }

        .link-btn.show { opacity: 1; pointer-events: auto; transform: none; }

        .low-note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: dot 1.4s ease-in-out infinite; }

        @media (max-width: 768px) {

            .custom-cta { flex: 1; justify-content: center; }
            .sort, .stock-toggle { flex: 1 1 auto; justify-content: center; }
            .ghost-btn { padding: 8px 12px; }
        }

        /* ===== v3: layout, Arabic type, smoother motion ===== */
        html { scroll-behavior: smooth; }
        body.ar { --font-arabic-body: 'Readex Pro', 'IBM Plex Sans Arabic', sans-serif; --font-arabic-display: 'Changa', 'Readex Pro', sans-serif; }
        body.ar h1, body.ar h2, body.ar h3, body.ar .logo, body.ar .p-price, body.ar .badge, body.ar .eyebrow,
        body.ar .seg-btn, body.ar .custom-cta, body.ar .btn-gold, body.ar .ghost-btn, body.ar .chip,

        }

        /* nav */
        nav { padding: 14px 4%; background: rgba(5,5,5,.72); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,.08); }

        .qty-btn, .msg-card, .history-card, .cart-item img { transition: background .3s var(--ease), color .3s var(--ease), transform .4s var(--ease), border-color .3s var(--ease); }
        .cart-item { animation: none; }

        /* page layout */
        .container { max-width: 1360px; padding: 8px 4% 70px; }
        .page-head { padding: 34px 0 26px; animation: rise .9s var(--ease) backwards; }
        .eyebrow { display: inline-block; font: 700 .7rem var(--font-tech); letter-spacing: .2em; color: var(--gold-primary); margin-bottom: 12px; }
        .page-head h1 { font: 800 clamp(1.5rem, 4vw, 2.6rem)/1.15 var(--font-tech); margin-bottom: 12px; }

        .products-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
        .img-box { height: auto; aspect-ratio: 4 / 3; }
        .p-info { padding: 16px 16px 14px; gap: 14px; }
        .p-title { margin-bottom: 0; }
        .p-row { display: flex; justify-content: space-between; align-items: center; }
        .p-go { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,215,0,.1); color: var(--gold-primary); transition: background .4s var(--ease), color .4s var(--ease), transform .5s var(--ease); }

/* ===== v4 shared ===== */
:root{--bg-deep:#000;--ease:cubic-bezier(.22,1,.36,1);--ar-body:'Readex Pro','IBM Plex Sans Arabic',sans-serif;--ar-head:'Cairo','Readex Pro',sans-serif;--logo-font:'Syne',sans-serif}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*{scroll-behavior:auto}
body{background:#000!important}
img{max-width:100%}

/* static dotted-grid background (no glows, no grain) */
#bg-canvas{display:none!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:#000;background-image:radial-gradient(circle,rgba(255,255,255,.28) 1px,transparent 1.6px);background-size:clamp(44px,5.4vw,76px) clamp(44px,5.4vw,76px);background-position:center}

/* navbar: same shape everywhere, ends curve inward */
nav{position:sticky;top:0;z-index:1000;background:#0b0b0b!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;border-bottom:1px solid rgba(255,255,255,.08)!important;border-radius:0!important;width:100%!important;max-width:none!important;margin:0!important;padding:14px max(20px,calc((100% - 1200px)/2))!important;display:flex;align-items:center;gap:12px;animation:navIn .8s var(--ease) backwards}
@keyframes navIn{from{opacity:0;transform:translateY(-100%)}}
nav::before,nav::after{content:"";position:absolute;top:100%;width:26px;height:26px;background:#0b0b0b;pointer-events:none}
nav::before{left:0;-webkit-mask:radial-gradient(circle at 100% 100%,transparent 25px,#000 25.5px);mask:radial-gradient(circle at 100% 100%,transparent 25px,#000 25.5px)}
nav::after{right:0;-webkit-mask:radial-gradient(circle at 0 100%,transparent 25px,#000 25.5px);mask:radial-gradient(circle at 0 100%,transparent 25px,#000 25.5px)}

/* logo never changes with language */
.logo,.logo *,body.rtl .logo,body.rtl .logo *,body.ar .logo,body.ar .logo *{font-family:var(--logo-font)!important;font-weight:800!important;letter-spacing:-.01em!important;text-shadow:none!important;text-transform:uppercase}
.logo{direction:ltr;unicode-bidi:isolate;white-space:nowrap;display:inline-block;font-size:clamp(1.05rem,4.2vw,1.4rem)!important;text-decoration:none;color:#fff}
.logo span{color:var(--gold-primary)}
.logo::after{content:none!important}
.logo span{display:inline!important}

/* flags */
.flags{display:flex;gap:8px;align-items:center}
.flag{width:32px;height:32px;border-radius:50%;padding:0;border:2px solid transparent;background:none;cursor:pointer;opacity:.5;filter:grayscale(.45);overflow:hidden;transition:opacity .45s var(--ease),filter .45s var(--ease),transform .5s var(--ease),border-color .45s var(--ease),box-shadow .5s var(--ease)}
.flag svg{width:100%;height:100%;display:block}
.flag:hover{opacity:.95;filter:none;transform:translateY(-2px) scale(1.1)}
.flag:active{transform:scale(.92)}
.flag.active{opacity:1;filter:none;border-color:var(--gold-primary);box-shadow:0 0 0 4px rgba(255,215,0,.12),0 8px 20px -8px rgba(255,215,0,.6);transform:scale(1.06)}
@media(max-width:480px){.flag.active{display:none}.flag{width:34px;height:34px;opacity:1;filter:none;border-color:rgba(255,255,255,.2)}}

/* Arabic typography: no overlap, roomy line-height, never stretched letter-spacing */
body.rtl,body.ar{line-height:1.8}
body.rtl *,body.ar *{font-family:var(--ar-body)!important;letter-spacing:0!important}
body.rtl h1,body.rtl h2,body.rtl h3,body.rtl h4,body.rtl .card h3,body.rtl .stat-item h4,body.rtl .legal-title,body.rtl .beta-tag,body.rtl .btn,
body.ar h1,body.ar h2,body.ar h3,body.ar h4,body.ar .p-title,body.ar .p-price,body.ar .eyebrow,body.ar .btn-gold,body.ar .custom-cta,body.ar .low-stock-badge,body.ar .out-of-stock-badge,body.ar .badge,body.ar .google-auth-btn{font-family:var(--ar-head)!important;font-weight:800!important;letter-spacing:0!important;text-shadow:none!important}
body.rtl h1,body.ar h1{line-height:1.45!important;padding-block:.08em}
body.rtl h2,body.ar h2{line-height:1.5!important}
body.rtl p,body.ar p{line-height:1.9}

/* smoother, consistent press / hover motion */
button,.btn,.btn-gold,.custom-cta,.icon-btn,.flag,.card,.product-card{-webkit-tap-highlight-color:transparent}
button:active,.btn:active{transform:scale(.97)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;overflow-x:clip;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* large laptops / desktops */

}
@media(min-width:560px) and (max-width:768px){.products-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
/* touch devices: comfortable tap targets, no sticky hover */
@media(pointer:coarse){
  .icon-btn{min-width:40px;min-height:40px;display:inline-grid;place-items:center}
  .nav-links a,.opt,.f-btn,.sort,.price-row .go{min-height:44px}
}
@media(hover:none){.card:hover,.card.proj:hover,.product-card:hover,.btn:hover{transform:none}}

}
/* folded foldables / very narrow cover screens (~280-360px) */
@media(max-width:360px){
  nav{gap:6px!important;padding-top:9px!important;padding-bottom:9px!important}
  .logo{font-size:1rem!important}

  .r-bar{flex-wrap:wrap}
  .sort{max-width:120px}
}
@media(max-width:300px){

  .logo{font-size:.9rem!important}
  .icon-btn svg{width:19px;height:19px}

        // --- PARTICLES ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -4 - 2;
                this.speedX = (Math.random() - 0.5) * 3;
                this.gravity = 0.05;
                this.opacity = 1;
                this.rotation = Math.random() * Math.PI;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX;
                this.speedY += this.gravity; this.opacity -= 0.007; this.rotation += 0.1;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`; ctx.shadowBlur = 10; ctx.shadowColor = "gold";
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size); ctx.restore();
            }
        }

        function triggerParticles() {
            particles = Array.from({length: 120}, () => new Particle());
            function animate() {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                particles.forEach((p, i) => { p.update(); p.draw(); if(p.opacity <= 0) particles.splice(i, 1); });
                if(particles.length > 0) requestAnimationFrame(animate);
            }
            animate();
        }

        // --- INBOX LOGIC ---
        async function fetchInbox() {
            if (!currentUser) return; 

            return new Promise((resolve) => {
                Papa.parse(INBOX_SHEET_URL, {
                    download: true, header: true,

                        const myMessages = results.data.filter(row =>

                        renderInbox(myMessages);
                        resolve();
                    },
                    error: () => resolve()
                });
            });
        }

        function renderInbox(messages) {
            // Check if data actually changed to prevent flickering
            const currentDataStr = JSON.stringify(messages);
            if (currentDataStr === lastInboxState) return; 
            lastInboxState = currentDataStr;

            const container = document.getElementById('inboxContent');
            const badge = document.getElementById('inboxCount');
            
            if (messages.length > 0) {
                badge.innerText = messages.length;
                badge.style.display = 'block';
                badge.style.animation = 'zoomPop 0.3s ease';
            } else {
                badge.style.display = 'none';
            }

            if (messages.length === 0) {
                container.innerHTML = `<div class="empty-inbox">${currentLang === 'en' ? 'No new messages' : 'لا توجد رسائل جديدة'}</div>`;
                return;
            }

            container.innerHTML = "";
            [...messages].reverse().forEach(msg => {
                container.innerHTML += `
                    <div class="msg-card unread">
                        <div class="msg-date">${msg.Date || 'Just now'}</div>
                        <div class="msg-title">${msg.Title}</div>
                        <div class="msg-body">${msg.Message}</div>
                    </div>
                `;
            });
        }

        // --- STATUS SYNC LOGIC ---
        async function fetchStatusSheet() {
            return new Promise((resolve) => {
                Papa.parse(STATUS_SHEET_URL, {
                    download: true, header: true,
                    complete: (results) => {
                        const newMap = {};
                        results.data.forEach(row => {
                            if(row.OrderID && row.Status) newMap[row.OrderID.trim()] = row.Status.trim();
                        });

                        Object.keys(newMap).forEach(oid => {
                            const newStatus = newMap[oid];
                            const oldStatus = oldStatusMap[oid];

                            if(oldStatus && oldStatus !== newStatus) {
                                let color = "#fff";
                                let msg = "";
                                
                                if(newStatus.toLowerCase().includes("ready")) {
                                    color = "#00FF00"; 
                                    msg = currentLang === 'en'
                                        ? "Your Order is READY! Contact: 0543945482"
                                        : "طلبك جاهز! تواصل معنا: 0543945482";
                                }
                                else if(newStatus.toLowerCase().includes("cancel")) {
                                    color = "#FF0000"; 
                                    msg = currentLang === 'en' ? "Your Order was Cancelled" : "تم إلغاء طلبك";
                                }
                                else if(newStatus.toLowerCase().includes("under")) {
                                    color = "#FFA500"; 
                                    msg = currentLang === 'en' ? "Your Order is Under Review" : "طلبك قيد المراجعة";
                                }
                                else {
                                    msg = currentLang === 'en' ? `Order Status: ${newStatus}` : `حالة الطلب: ${newStatus}`;
                                }
                                
                                notify(msg, color);
                            }
                        });

                        statusMap = newMap;
                        oldStatusMap = {...newMap};
                        resolve();
                    },
                    error: () => resolve()
                });
            });
        }

        // --- CATALOG & FILTERS ---
        // Sheet columns: name, name_ar, price, image, description, description_ar,
        //                instock (TRUE / FALSE / LOW), category (PARTS / PROJECTS), filter, filter_ar
        const hdr = h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const tr = (en, ar) => currentLang === 'ar' ? ar : en;
        const val = (p, k) => String(p[k] ?? '').trim();
        const stockOf = p => { const v = val(p, 'instock').toLowerCase(); return ['false', 'no', '0', 'out'].includes(v) ? 'out' : v === 'low' ? 'low' : 'in'; };
        const isOut = p => stockOf(p) === 'out', isLow = p => stockOf(p) === 'low';
        const catOf = p => val(p, 'category').toLowerCase().startsWith('proj') ? 'projects' : 'parts';
        const nameOf = p => (currentLang === 'ar' && val(p, 'namear')) || val(p, 'name');
        const descOf = p => (currentLang === 'ar' && val(p, 'descriptionar')) || val(p, 'description');
        const subOf = p => val(p, 'filter') || val(p, 'filterar');
        const subLabel = p => (currentLang === 'ar' && val(p, 'filterar')) || subOf(p);
        const priceOf = p => { const n = parseFloat(String(p.price).replace(/[^0-9.]/g, '')); return isNaN(n) ? Infinity : n; };
        const state = { cat: 'parts', q: '', subs: new Set(), avail: new Set(), min: '', max: '', sort: 'default' };
        let loaded = false, searchTimer;

        Papa.parse(PRODUCTS_SHEET_URL, { download: true, header: true, skipEmptyLines: 'greedy', transformHeader: hdr,
            complete: res => { allProducts = res.data.filter(p => val(p, 'name')); loaded = true; renderAll(); },
            error: () => { loaded = true; allProducts = []; renderAll(); } });

        const pass = (p, skip = []) => {
            if (!skip.includes('cat') && catOf(p) !== state.cat) return false;
            if (!skip.includes('sub') && state.subs.size && !state.subs.has(subOf(p))) return false;
            if (!skip.includes('avail') && state.avail.size && !state.avail.has(stockOf(p))) return false;
            if (!skip.includes('price')) { const n = priceOf(p); if (state.min !== '' && !(n >= +state.min)) return false; if (state.max !== '' && !(n <= +state.max)) return false; }
            const q = state.q.trim().toLowerCase();
            return !q || ['name', 'namear', 'description', 'descriptionar', 'filter', 'filterar'].some(k => val(p, k).toLowerCase().includes(q));
        };
        const cnt = (skip, fn) => allProducts.filter(p => pass(p, skip) && fn(p)).length;
        const subName = k => { const p = allProducts.find(p => subOf(p) === k); return p ? subLabel(p) : k; };

        const opt = (type, name, checked, fn, label, n, k = '') =>
            `<label class="opt${n === 0 && !checked ? ' dim' : ''}"><input type="${type}" ${name ? `name="${name}"` : ''} ${checked ? 'checked' : ''} data-k="${esc(k)}" onchange="${fn}"><i class="bx ${type === 'radio' ? 'rd' : ''}"></i><span class="tx">${esc(label)}</span><em>${n}</em></label>`;

        function renderFacets() {
            if (!loaded) return;
            document.getElementById('fCat').innerHTML = [['parts', tr('Parts', 'القطع')], ['projects', tr('Projects', 'المشاريع')]]
                .map(([k, l]) => opt('radio', 'dept', state.cat === k, `setCat('${k}')`, l, cnt(['cat', 'sub'], p => catOf(p) === k))).join('');
            const subs = new Map();
            allProducts.filter(p => catOf(p) === state.cat && subOf(p)).forEach(p => { if (!subs.has(subOf(p))) subs.set(subOf(p), subLabel(p)); });
            for (const k of [...state.subs]) if (!subs.has(k)) state.subs.delete(k);
            document.getElementById('fSubSec').style.display = subs.size ? '' : 'none';
            document.getElementById('fSub').innerHTML = [...subs].map(([k, l]) => opt('checkbox', '', state.subs.has(k), 'toggleSub(this.dataset.k)', l, cnt(['sub'], p => subOf(p) === k), k)).join('');
            document.getElementById('fAvail').innerHTML = [['in', 'Available', 'متوفر'], ['low', 'Low stock', 'كمية محدودة'], ['out', 'Out of stock', 'نفذت الكمية']]
                .map(([k, en, ar]) => opt('checkbox', '', state.avail.has(k), 'toggleAvail(this.dataset.k)', tr(en, ar), cnt(['avail'], p => stockOf(p) === k), k)).join('');
            const mn = document.getElementById('pMin'), mx = document.getElementById('pMax');
            if (document.activeElement !== mn) mn.value = state.min; if (document.activeElement !== mx) mx.value = state.max;
        }

        function renderPills() {
            const a = [];
            if (state.q.trim()) a.push([`“${esc(state.q.trim())}”`, 'q']);
            state.subs.forEach(k => a.push([esc(subName(k)), 'sub:' + k]));
            state.avail.forEach(k => a.push([tr({ in: 'Available', low: 'Low stock', out: 'Out of stock' }[k], { in: 'متوفر', low: 'كمية محدودة', out: 'نفذت الكمية' }[k]), 'av:' + k]));
            if (state.min !== '' || state.max !== '') a.push([`${tr('Price', 'السعر')}: ${state.min || 0} – ${state.max || '∞'}`, 'price']);
            document.getElementById('pills').innerHTML = a.map(([l, k]) => `<button type="button" class="pill" data-k="${esc(k)}" onclick="removePill(this.dataset.k)"><span>${l}</span><i>✕</i></button>`).join('');
            document.getElementById('clearFilters').classList.toggle('show', a.length > 0);
            document.getElementById('fCount').textContent = state.subs.size + state.avail.size + (state.min !== '' || state.max !== '' ? 1 : 0);
            document.getElementById('fCount').classList.toggle('on', +document.getElementById('fCount').textContent > 0);
        }

        function renderProducts() {
            if (!loaded) return;
            let list = allProducts.filter(p => pass(p));
            if (state.sort !== 'default') list = [...list].sort((a, b) =>
                state.sort === 'name' ? nameOf(a).localeCompare(nameOf(b), currentLang) :
                state.sort === 'priceAsc' ? priceOf(a) - priceOf(b) : priceOf(b) - priceOf(a));
            const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
            const empty = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg><p>${tr('No products match your filters', 'لا توجد منتجات مطابقة للتصفية')}</p><button class="btn-gold" onclick="clearFilters()">${tr('CLEAR FILTERS', 'مسح التصفية')}</button></div>`;
            document.getElementById('productsGrid').innerHTML = list.length ? list.map((p, i) => {
                const st = stockOf(p);
                const cls = 'product-card' + (st === 'out' ? ' out-of-stock-card' : '') + (st === 'low' ? ' low-stock-card' : '');
                const badge = st === 'out' ? `<div class="out-of-stock-badge">${tr('OUT OF STOCK', 'نفذت الكمية')}</div>` : st === 'low' ? `<div class="low-stock-badge">${tr('LOW STOCK', 'كمية محدودة')}</div>` : '';
                return `<div class="${cls}" style="animation-delay:${Math.min(i, 12) * 0.05}s" onclick="openProduct(${allProducts.indexOf(p)})">${badge}<div class="img-box"><img src="${esc(p.image)}" loading="lazy" alt="${esc(nameOf(p))}"></div><div class="p-info"><div class="p-title">${esc(nameOf(p))}</div><div class="p-row"><div class="p-price">${esc(p.price)}</div><span class="p-go">${arrow}</span></div></div></div>`;
            }).join('') : empty;
            renderPills();
            const n = list.length;
            document.getElementById('resultsCount').textContent = tr(`${n} ${n === 1 ? 'result' : 'results'}`, `${n} نتيجة`);
            document.getElementById('fApply').textContent = tr(`Show ${n} results`, `عرض ${n} نتيجة`);
        }
        function renderAll() { renderFacets(); renderProducts(); }

        window.setCat = k => { state.cat = k; state.subs.clear(); renderAll(); };
        window.toggleSub = k => { state.subs.has(k) ? state.subs.delete(k) : state.subs.add(k); renderAll(); };
        window.toggleAvail = k => { state.avail.has(k) ? state.avail.delete(k) : state.avail.add(k); renderAll(); };
        window.applyPrice = () => { state.min = document.getElementById('pMin').value; state.max = document.getElementById('pMax').value; renderAll(); };
        window.onSearch = v => {
            clearTimeout(searchTimer);
            document.getElementById('searchBox').classList.toggle('has-text', !!v);
            searchTimer = setTimeout(() => { state.q = v; renderAll(); }, 140);
        };
        window.clearSearch = () => { const i = document.getElementById('searchInput'); i.value = ''; onSearch(''); i.focus(); };
        window.setSort = v => { state.sort = v; renderProducts(); };
        window.removePill = k => {
            if (k === 'q') clearSearch(); else if (k === 'price') { state.min = state.max = ''; }
            else if (k.startsWith('sub:')) state.subs.delete(k.slice(4)); else if (k.startsWith('av:')) state.avail.delete(k.slice(3));
            renderAll();
        };
        window.clearFilters = () => {
            clearTimeout(searchTimer);
            state.q = ''; state.subs.clear(); state.avail.clear(); state.min = state.max = '';
            const i = document.getElementById('searchInput'); i.value = ''; document.getElementById('searchBox').classList.remove('has-text');
            renderAll();
        };
        window.toggleFilters = open => document.body.classList.toggle('sheet-open', open);
        addEventListener('keydown', e => { if (e.key === 'Escape') toggleFilters(false); });

        // hover spotlight on cards + click ripple on buttons
        document.getElementById('productsGrid').addEventListener('pointermove', e => {
            const c = e.target.closest('.product-card'); if (!c) return;
            const r = c.getBoundingClientRect();
            c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
        document.addEventListener('pointerdown', e => {
            const b = e.target.closest('.btn-gold,.ghost-btn,.custom-cta,.apply-btn,.google-auth-btn,.chip,.seg-btn'); if (!b) return;
            const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, el = document.createElement('span');
            el.className = 'ripple';
            el.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
            b.appendChild(el); setTimeout(() => el.remove(), 700);
        });

        window.openProduct = (idx) => {
            const p = allProducts[idx];
            if(isOut(p)) return notify(currentLang==='en'?"Out of Stock!":"نفذت الكمية!", "#FF0000");
            document.getElementById('modalImg').src = p.image; document.getElementById('modalTitle').innerText = nameOf(p);
            document.getElementById('modalPrice').innerText = p.price; document.getElementById('modalDesc').innerText = descOf(p) || "...";
            document.getElementById('modalLow').style.display = isLow(p) ? 'flex' : 'none'; selectQuality('Mid'); document.getElementById('productModal').classList.add('open');
            document.getElementById('modalAddBtn').onclick = () => addToCart(idx);
        };

        window.selectQuality = (q) => { selectedQuality = q; document.querySelectorAll('.q-opt').forEach(o => o.classList.remove('selected')); document.getElementById('q'+q).classList.add('selected'); };
        window.addToCart = (idx) => {
            const p = allProducts[idx]; let pNum = parseFloat(p.price.replace(/[^0-9.]/g, ''));
            if(selectedQuality === 'High') pNum *= 1.2;
            const ex = cart.find(i => i.idx === idx && i.quality === selectedQuality);
            if(ex) ex.qty++; else cart.push({ idx, name: nameOf(p), price: pNum, qty: 1, quality: selectedQuality, img: p.image });
            updateCartUI(); updateDoc(doc(db, "users", currentUser.uid), { cart: cart }); closeModals();
            notify(currentLang==='en'?"Added to Cart":"تمت الإضافة للسلة", "#FFD700");
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cartItemsList'); let total = 0;
            list.innerHTML = cart.length ? "" : `<div style="text-align:center; padding:50px; color:#444;">${currentLang==='en'?'Cart is Empty':'السلة فارغة'}</div>`;
            cart.forEach((item, i) => {
                total += item.price * item.qty;
                list.innerHTML += `<div class="cart-item"><img src="${item.img}"><div style="flex:1"><div style="font-size:0.9rem; font-weight:600;">${item.name}</div><div style="font-size:0.7rem; color:#666;">${item.quality}</div><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(${i},-1)">-</button><span style="font-size:0.8rem">${item.qty}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button></div></div><div style="color:var(--gold-primary); font-weight:700;">$${(item.price * item.qty).toFixed(2)}</div></div>`;
            });

            const displayEl = document.getElementById('cartTotalDisplay');
            if (justAppliedCoupon && discount < 1.0) {
                displayEl.innerHTML = `<span class="old-price">$${total.toFixed(2)}</span> <span class="new-price">$${(total * discount).toFixed(2)}</span>`;
            } else {
                displayEl.innerText = "$" + (total * discount).toFixed(2);
            }
            
            const cc = document.getElementById('cartCount'), cn = String(cart.reduce((a, b) => a + b.qty, 0));
            if (cc.innerText !== cn) { cc.innerText = cn; cc.classList.remove('bump'); void cc.offsetWidth; cc.classList.add('bump'); }
        };

        window.changeQty = (i, d) => { cart[i].qty += d; if(cart[i].qty <= 0) cart.splice(i, 1); updateCartUI(); updateDoc(doc(db, "users", currentUser.uid), { cart: cart }); };

        window.validateAndSubmit = async (e) => {
            e.preventDefault();
            if(!currentUser) return handleAuth();
            if(!cart.length) return;
            const sec = document.getElementById('phoneInputSection'), ph = document.getElementById('userPhone');
            if(sec.style.display === 'none') { sec.style.display = 'block'; ph.focus(); return notify(currentLang==='en'?"Almost there! We need your phone.":"خطوة أخيرة! نحتاج رقم هاتفك.", "#FFA500"); }
            
            const phoneRegex = /^(05|5|\+966|00966)[0-9]{8,11}$/;
            if(!phoneRegex.test(ph.value.replace(/\s/g, ''))) { ph.style.borderColor = "red"; return; }

            const btn = document.getElementById('checkoutBtn'); btn.disabled = true; btn.innerText = "...";
            const orderStr = cart.map(i => `${i.name} (${i.quality}) x${i.qty}`).join(' | ') + (discount < 1 ? " [15% OFF]" : "");
            
            const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('hiddenOrderData').value = `[ID: ${orderId}] \nDetails: ${orderStr}`;
            document.getElementById('hiddenUserEmail').value = currentUser.email;
            document.getElementById('hiddenUserPhone').value = ph.value;

            try {
                const res = await fetch(e.target.action, { method: 'POST', body: new FormData(e.target), headers: {'Accept': 'application/json'} });
                if (res.ok) {
                    const newOrder = { id: orderId, date: new Date().toLocaleString(), details: orderStr };
                    await updateDoc(doc(db, "users", currentUser.uid), { history: arrayUnion(newOrder), cart: [] });
                    notify(currentLang==='en' ? "Success! Order Logged." : "تم بنجاح! تم تسجيل طلبك.", "#00FF00");
                    cart = []; updateCartUI(); closeModals(); ph.value = ''; sec.style.display = 'none'; syncUserData();
                }
            } catch (err) { notify("Error!", "#FF0000"); } finally { btn.disabled = false; btn.innerText = currentLang==='en'?"CHECKOUT NOW":"إتمام الشراء"; }
        };

        // --- NEW CUSTOM PROJECT HANDLERS ---
        
        window.openCustomRequest = () => {
            if(!currentUser) {
                notify(currentLang === 'en' ? "Please Sign In to make a request" : "يرجى تسجيل الدخول لتقديم طلب", "#FFA500");
                handleAuth();
                return;
            }
            togglePanel('customProjectModal');
        };

        window.handleCustomSubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            
            // Phone Validation Logic
            const ph = e.target.querySelector('input[name="Phone"]');
            const phoneRegex = /^(05|5|\+966|00966)[0-9]{8,11}$/;
            if(!phoneRegex.test(ph.value.replace(/\s/g, ''))) {
                notify(currentLang === 'en' ? "Please enter a valid Saudi mobile number" : "يرجى إدخال رقم جوال سعودي صحيح", "#FF0000");
                ph.style.borderColor = "red";
                ph.focus();
                return;
            } else {
                ph.style.borderColor = "#333";
            }

            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "...";

            if (currentUser) {
                const hiddenEmail = document.createElement('input');
                hiddenEmail.type = 'hidden'; hiddenEmail.name = 'User_Email'; hiddenEmail.value = currentUser.email;
                e.target.appendChild(hiddenEmail);
            }

            try {
                const res = await fetch(e.target.action, {
                    method: 'POST',
                    body: new FormData(e.target),
                    headers: {'Accept': 'application/json'}
                });

                if (res.ok) {
                    closeModals();
                    e.target.reset();
                    // Professional Success Message
                    const msgEn = "Thank you for your request. Our engineering team will review the requirements and contact you shortly.";
                    const msgAr = "شكراً لطلبك. سيقوم فريقنا الهندسي بمراجعة المتطلبات والتواصل معك قريباً.";
                    notify(currentLang === 'en' ? msgEn : msgAr, "#00FF00");
                } else {
                    notify(currentLang === 'en' ? "Submission Failed" : "فشل الإرسال", "#FF0000");
                }
            } catch (error) {
                notify("Network Error", "#FF0000");
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        };

        function renderHistory(h) {
            const c = document.getElementById('historyContent'); 
            c.innerHTML = h.length ? "" : `<p style='text-align:center; color:#444;'>No orders yet</p>`;
            [...h].reverse().forEach(o => { 
                const id = o.id || "OLD-ORDER";
                const details = typeof o === 'string' ? o : o.details;
                const date = o.date || "N/A";
                let status = statusMap[id] || "Processing";
                
                let color = "#888";
                let extraInfo = "";

                if(status.toLowerCase().includes("ready")) {
                    color = "#00FF00";
                    extraInfo = `
                    <div class="contact-info">
                        <strong>READY FOR PICKUP!</strong><br>
                        Number: 0543945482<br>
                        Location: <a href="https://www.google.com/maps/place/RIYADUINO/@24.7060923,46.7417012,21z/data=!4m6!3m5!1s0x3e2f03437de4bd47:0xb1ba818f2b0a8cbc!8m2!3d24.7062064!4d46.7416725!16s%2Fg%2F11yn_szgsf?entry=ttu&g_ep=EgoyMDI2MDEwNy4wIKXMDSoKLDEwMDc5MjA2OUgBUAM%3D" target="_blank">Click Here</a>
                    </div>`;
                }
                else if(status.toLowerCase().includes("under")) color = "#FFA500";
                else if(status.toLowerCase().includes("cancel")) color = "#FF4444";

                c.innerHTML += `
                    <div class="history-card" style="border-left: 4px solid ${color}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <div class="history-date">${date}</div>
                            <div style="color:${color}; font-size:0.65rem; border:1px solid ${color}; padding:2px 6px; border-radius:4px; font-weight:900;">${status.toUpperCase()}</div>
                        </div>
                        <div style="font-size:0.8rem; color:#888;">${details}</div>
                        ${extraInfo}
                    </div>`; 
            });
        }

        window.togglePanel = (id) => { 
            closeModals(); 
            document.getElementById(id).classList.add('open');
            if(id === 'historyModal') fetchStatusSheet().then(() => syncUserData());
            if(id === 'inboxModal') fetchInbox();
        };
        window.closeModals = () => { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); };
        window.setLang = (l) => {
            currentLang = l; document.body.className = l; document.documentElement.lang = l;
            document.querySelectorAll('[data-en]').forEach(el => el.innerHTML = el.getAttribute('data-' + l));
            document.querySelectorAll('[data-en-p]').forEach(el => el.placeholder = el.getAttribute('data-' + l + '-p'));
            markFlags(l); syncLinks(l);
            try { localStorage.setItem('rdu-lang', l); } catch (e) {}
            if (loaded) renderAll(); updateCartUI();
        };
        window.toggleLang = () => setLang(currentLang === 'en' ? 'ar' : 'en');

        // --- INIT: deep link (?category=projects&lang=ar) ---
        {
            const qp = new URLSearchParams(location.search);
            if ((qp.get('category') || '').toLowerCase().startsWith('proj')) state.cat = 'projects';
            let sv = null; try { sv = localStorage.getItem('rdu-lang'); } catch (e) {}
            const l = qp.get('lang');
            setLang(l === 'ar' || l === 'en' ? l : (sv === 'ar' ? 'ar' : 'en'));
        }
    </script>

<script>
(()=>{

window.syncLinks=l=>document.querySelectorAll('a[href^="store.html"],a[href^="index.html"]').forEach(a=>{const [p,q='']=a.getAttribute('href').split('?');const u=new URLSearchParams(q);u.set('lang',l);a.setAttribute('href',p+'?'+u)});
window.markFlags=l=>document.querySelectorAll('.flag').forEach(f=>{const on=f.dataset.lang===l;f.classList.toggle('active',on);f.setAttribute('aria-pressed',on)});
const nv=document.querySelector('nav');const setH=()=>document.documentElement.style.setProperty('--nav-h',nv.offsetHeight+'px');setH();addEventListener('resize',setH);
})();
</script>
</body>
</html>
