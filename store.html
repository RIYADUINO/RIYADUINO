<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIYADUINO | Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lalezar&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --bg-elevated: #0a0a0a;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.055);
            --glass: rgba(12, 12, 12, 0.75);
            --hairline: rgba(255, 255, 255, 0.09);
            --gold: #FFD700;
            --gold-soft: rgba(255, 215, 0, 0.16);
            --gold-glow: rgba(255, 215, 0, 0.45);
            --warn: #FFD60A;
            --text: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #6e6e73;
            --danger: #ff453a;
            --success: #30d158;
            --radius: 14px;
            --radius-lg: 20px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-display: 'Syne', system-ui, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-ar: 'IBM Plex Sans Arabic', system-ui, sans-serif;
            --font-ar-display: 'Lalezar', 'IBM Plex Sans Arabic', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;

            /* Navbar shape: R = inward curve at the ends, r = rounded bottom corners */
            --R: 26px;
            --r: 22px;
            --nav-mask:
                radial-gradient(circle at 0 100%, transparent calc(var(--R) - .7px), #000 var(--R)) left 0 top 0 / var(--R) var(--R) no-repeat,
                radial-gradient(circle at 100% 100%, transparent calc(var(--R) - .7px), #000 var(--R)) right 0 top 0 / var(--R) var(--R) no-repeat,
                linear-gradient(#000, #000) left var(--R) top 0 / calc(100% - var(--R) * 2) calc(100% - var(--r)) no-repeat,
                linear-gradient(#000, #000) left calc(var(--R) + var(--r)) bottom 0 / calc(100% - (var(--R) + var(--r)) * 2) var(--r) no-repeat,
                radial-gradient(circle at 100% 0, #000 calc(var(--r) - .7px), transparent var(--r)) left var(--R) bottom 0 / var(--r) var(--r) no-repeat,
                radial-gradient(circle at 0 0, #000 calc(var(--r) - .7px), transparent var(--r)) right var(--R) bottom 0 / var(--r) var(--r) no-repeat;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); scrollbar-gutter: stable; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            animation: pageIn .9s var(--ease) backwards;
        }
        body.leaving { opacity: 0; transition: opacity .34s ease; }
        body.modal-open { overflow: hidden; }
        @keyframes pageIn { from { opacity: 0; } }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 8px; }

        /* =========================================
           ARABIC TYPOGRAPHY
           Lalezar for display / buttons, IBM Plex Sans Arabic for reading text
           ========================================= */
        body.ar { direction: rtl; text-align: right; font-family: var(--font-ar); }
        body.ar * { font-family: var(--font-ar); letter-spacing: 0 !important; word-spacing: normal !important; }
        body.ar :is(h1, h2, h3, .gbtn, .btn-gold, .google-auth-btn, .seg button, .chip, .apply-btn, .link-btn) {
            font-family: var(--font-ar-display);
            font-weight: 400;
        }
        body.ar .logo, body.ar .logo * { font-family: var(--font-display); font-weight: 800; }
        body.ar :is(.p-price, .cnt, .badge, .form-label, .msg-date, .history-date, #cartTotalDisplay, #modalPrice, #resultCount) { font-family: var(--font-mono); }
        body.ar h1 { font-size: clamp(2.5rem, 5.2vw, 3.8rem); line-height: 1.2; }
        body.ar :is(.seg button, .chip, .gbtn, .btn-gold) { font-size: 1rem; }
        body.ar .panel-header h2 { font-size: 1.35rem; }

        /* --- TOAST --- */
        #notification-area {
            position: fixed;
            top: 84px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 380px;
        }
        .notify-toast {
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--hairline);
            border-left: 3px solid var(--gold);
            color: var(--text);
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 0.8rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            animation: toastIn .6s var(--ease);
            transition: opacity .45s var(--ease), transform .45s var(--ease);
            pointer-events: auto;
            line-height: 1.45;
        }
        .notify-toast.out { opacity: 0; transform: translateY(-14px) scale(.97); }
        @keyframes toastIn { from { transform: translateY(-30px) scale(.96); opacity: 0; } }

        .cursor-glow {
            position: fixed;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 40;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.35s;
        }
        body:hover .cursor-glow { opacity: 1; }
        @media (max-width: 768px), (hover: none) { .cursor-glow { display: none; } }

        /* --- NAVIGATION: hangs from the top edge, ends curve inward --- */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            isolation: isolate;
            width: min(1360px, 100%);
            height: 68px;
            margin: 0 auto;
            padding: 0 calc(var(--R) + 26px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        nav::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-mask: var(--nav-mask);
            mask: var(--nav-mask);
            transition: background .6s var(--ease);
        }
        nav.scrolled::before { background: linear-gradient(180deg, rgba(26,26,26,.86), rgba(14,14,14,.76)); }

        .logo {
            display: inline-block;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            transform-origin: left center;
            transition: transform .8s var(--ease);
        }
        .logo span { color: var(--gold); }
        .logo:hover { transform: scaleX(1.08); }
        body.ar .logo { transform-origin: right center; }
        .nav-links { display: flex; align-items: center; gap: 8px; }

        /* --- BUTTONS: gold solid + soft-cornered glass --- */
        .gbtn, .btn-gold, .icon-btn, .google-auth-btn, .close-btn, .chip, .seg button, .link-btn {
            -webkit-appearance: none; appearance: none;
            cursor: pointer;
        }
        .gbtn, .btn-gold, .icon-btn, .google-auth-btn {
            --tx: 0px; --ty: 0px; --lift: 0px; --sc: 1;
            position: relative;
            isolation: isolate;
            transform: translate3d(var(--tx), calc(var(--ty) + var(--lift)), 0) scale(var(--sc));
            transition: transform .55s var(--ease), box-shadow .55s var(--ease), background .5s var(--ease), color .4s var(--ease);
        }
        .gbtn:active, .btn-gold:active, .icon-btn:active, .google-auth-btn:active { --sc: .95; --lift: 0px; transition-duration: .16s; }

        .gbtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 12px;
            color: var(--text);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: .72rem;
            letter-spacing: .06em;
            background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.16), 0 8px 20px -12px rgba(0,0,0,.9);
        }
        .gbtn:hover {
            --lift: -2px;
            color: var(--gold);
            background: linear-gradient(180deg, rgba(255,215,0,.16), rgba(255,215,0,.04));
            box-shadow: inset 0 0 0 1px rgba(255,215,0,.5), inset 0 1px 0 rgba(255,255,255,.2), 0 14px 30px -12px var(--gold-glow);
        }
        .gbtn.accent { color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255,215,0,.42), inset 0 1px 0 rgba(255,255,255,.14), 0 8px 20px -12px rgba(0,0,0,.9); }
        .gbtn svg { transition: transform .6s var(--ease); }
        .gbtn:hover svg { transform: rotate(90deg); }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 12px;
            color: var(--text-secondary);
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), inset 0 1px 0 rgba(255,255,255,.12);
        }
        .icon-btn:hover {
            --lift: -2px;
            color: var(--gold);
            background: linear-gradient(180deg, rgba(255,215,0,.15), rgba(255,215,0,.04));
            box-shadow: inset 0 0 0 1px rgba(255,215,0,.45), inset 0 1px 0 rgba(255,255,255,.18), 0 12px 26px -12px var(--gold-glow);
        }
        .badge {
            position: absolute;
            top: -6px;
            inset-inline-end: -6px;
            background: var(--gold);
            color: #000;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 8px;
            min-width: 17px;
            text-align: center;
            font-family: var(--font-mono);
            box-shadow: 0 0 0 2px var(--bg);
        }
        .badge.bump { animation: bump .5s var(--ease); }
        @keyframes bump { 40% { transform: scale(1.5); } }

        .google-auth-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 12px;
            color: #000;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #FFE45C, #FFD700 50%, #FFB800);
            box-shadow: 0 0 0 1px rgba(255,215,0,.35), 0 8px 24px -10px var(--gold-glow);
        }
        .google-auth-btn:hover { --lift: -2px; box-shadow: 0 0 0 1px rgba(255,215,0,.6), 0 14px 32px -10px var(--gold-glow); }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            cursor: pointer;
            display: none;
            object-fit: cover;
            transition: box-shadow .5s var(--ease), transform .5s var(--ease);
        }
        .user-avatar:hover { box-shadow: 0 0 18px var(--gold-glow); transform: scale(1.06); }

        .btn-gold {
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            padding: 0 24px;
            border: 0;
            border-radius: 14px;
            color: #000;
            font-weight: 800;
            font-family: var(--font-display);
            letter-spacing: 0.08em;
            font-size: 0.82rem;
            background: linear-gradient(135deg, #FFE45C 0%, #FFD700 45%, #FFB800 100%);
            box-shadow: 0 0 0 1px rgba(255,215,0,0.35), 0 10px 30px -12px var(--gold-glow);
        }
        .btn-gold::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.6) 50%, transparent 65%);
            transform: translateX(-130%);
            transition: transform .9s var(--ease);
        }
        .btn-gold:hover { --lift: -3px; box-shadow: 0 0 0 1px rgba(255,215,0,.6), 0 18px 42px -12px var(--gold-glow); }
        .btn-gold:hover::before { transform: translateX(130%); }
        .btn-gold:disabled { opacity: .6; pointer-events: none; }

        .close-btn {
            flex: none;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 12px;
            color: var(--text-secondary);
            background: rgba(255,255,255,.06);
            transition: background .4s var(--ease), color .4s var(--ease), transform .7s var(--ease);
        }
        .close-btn:hover { background: var(--gold-soft); color: var(--gold); transform: rotate(90deg); }

        /* --- PAGE LAYOUT --- */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 44px 5% 96px;
            flex-grow: 1;
            width: 100%;
        }
        .store-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }
        .store-head h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(2.1rem, 4.6vw, 3.3rem);
            letter-spacing: -0.025em;
            line-height: 1.05;
        }
        .store-head p { margin-top: 10px; color: var(--text-secondary); font-size: .95rem; }

        /* --- FILTER BAR --- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px;
            border-radius: 20px;
            background: rgba(255,255,255,.03);
            box-shadow: inset 0 0 0 1px var(--hairline);
        }
        .seg {
            position: relative;
            display: inline-flex;
            padding: 4px;
            border-radius: 14px;
            background: rgba(0,0,0,.5);
            box-shadow: inset 0 0 0 1px var(--hairline);
        }
        .seg .thumb {
            position: absolute;
            top: 4px; bottom: 4px; left: 0;
            width: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFE45C, #FFD700 50%, #FFB800);
            box-shadow: 0 8px 22px -8px var(--gold-glow);
            transition: transform .6s var(--ease), width .6s var(--ease);
        }
        .seg button {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            height: 38px;
            padding: 0 18px;
            border: 0;
            border-radius: 10px;
            background: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: .78rem;
            letter-spacing: .05em;
            text-transform: uppercase;
            transition: color .45s var(--ease);
        }
        .seg button:hover { color: var(--text); }
        .seg button[aria-selected="true"] { color: #000; }
        .cnt {
            padding: 2px 7px;
            border-radius: 7px;
            background: rgba(255,255,255,.09);
            font-family: var(--font-mono);
            font-style: normal;
            font-weight: 500;
            font-size: .66rem;
            letter-spacing: 0;
            transition: background .45s var(--ease);
        }
        .seg button[aria-selected="true"] .cnt { background: rgba(0,0,0,.14); }

        .search { position: relative; flex: 1; min-width: 220px; }
        .search input {
            width: 100%;
            height: 48px;
            padding-inline: 46px;
            border: 0;
            border-radius: 14px;
            background: rgba(0,0,0,.5);
            color: var(--text);
            font-family: var(--font-body);
            font-size: .92rem;
            box-shadow: inset 0 0 0 1px var(--hairline);
            transition: box-shadow .45s var(--ease), background .45s var(--ease);
            -webkit-appearance: none; appearance: none;
        }
        .search input::-webkit-search-cancel-button { display: none; }
        .search input::placeholder { color: var(--text-tertiary); }
        .search input:focus { outline: none; background: rgba(0,0,0,.7); box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 0 5px rgba(255,215,0,.1); }
        .search .ico { position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; transition: color .4s var(--ease); }
        .search:focus-within .ico { color: var(--gold); }
        .search .clear {
            position: absolute;
            inset-inline-end: 8px;
            top: 50%;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border: 0; border-radius: 10px;
            background: rgba(255,255,255,.08);
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(.7);
            transition: opacity .35s var(--ease), transform .5s var(--ease), background .3s;
        }
        .search .clear.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
        .search .clear:hover { background: var(--gold-soft); color: var(--gold); }

        .chips-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s var(--ease); }
        .chips-wrap.show { grid-template-rows: 1fr; }
        .chips-inner { overflow: hidden; min-height: 0; }
        .chips {
            display: flex;
            gap: 8px;
            padding: 16px 2px 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 14px;
            border: 0;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: .76rem;
            letter-spacing: .03em;
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), inset 0 1px 0 rgba(255,255,255,.1);
            transition: color .4s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease), transform .5s var(--ease), opacity .4s;
        }
        .chip i { font-style: normal; font-family: var(--font-mono); font-size: .64rem; font-weight: 500; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,.08); transition: background .4s; }
        .chip:hover { color: var(--text); transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 1px 0 rgba(255,255,255,.14); }
        .chip:active { transform: scale(.95); transition-duration: .15s; }
        .chip[aria-pressed="true"] {
            color: #000;
            background: linear-gradient(135deg, #FFE45C, #FFD700 50%, #FFB800);
            box-shadow: 0 0 0 1px rgba(255,215,0,.5), 0 10px 24px -10px var(--gold-glow);
        }
        .chip[aria-pressed="true"] i { background: rgba(0,0,0,.14); }
        .chip.zero:not([aria-pressed="true"]) { opacity: .4; }

        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 34px;
            margin: 18px 4px 18px;
            color: var(--text-tertiary);
            font-family: var(--font-mono);
            font-size: .76rem;
        }
        .link-btn {
            border: 0;
            background: none;
            color: var(--gold);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: .74rem;
            letter-spacing: .04em;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background .35s var(--ease);
        }
        .link-btn:hover { background: var(--gold-soft); }
        .link-btn[hidden] { display: none; }

        /* --- PRODUCT GRID --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(262px, 1fr));
            gap: 22px;
            transition: opacity .25s ease, transform .25s ease;
        }
        .products-grid.swap { opacity: 0; transform: translateY(10px); }

        .product-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-lg);
            cursor: pointer;
            background: var(--surface);
            opacity: 0;
            transition: transform .6s var(--ease), box-shadow .6s var(--ease), background .5s var(--ease);
        }
        .product-card[hidden] { display: none !important; }
        .product-card.in { opacity: 1; }
        .product-card.reveal { animation: cardIn .9s var(--ease) var(--d, 0s) backwards; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.97); } }
        .product-card::after {
            content: "";
            position: absolute; inset: 0; z-index: 3;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px var(--hairline);
            pointer-events: none;
            transition: box-shadow .5s var(--ease);
        }
        .product-card::before {
            content: "";
            position: absolute; inset: 0; z-index: 2;
            opacity: 0;
            pointer-events: none;
            background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 0%), rgba(255,215,0,.11), transparent 62%);
            transition: opacity .5s var(--ease);
        }
        .product-card:hover { transform: translateY(-7px); background: var(--surface-hover); box-shadow: 0 30px 50px -30px rgba(0,0,0,.9); }
        .product-card:hover::after { box-shadow: inset 0 0 0 1px rgba(255,215,0,.4); }
        .product-card:hover::before { opacity: 1; }
        .product-card:active { transform: translateY(-3px) scale(.99); transition-duration: .2s; }

        .img-box { aspect-ratio: 4 / 3; background: #0b0b0b; overflow: hidden; position: relative; }
        .img-box img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;

        .contact-info a { color: var(--gold); text-decoration: none; }

        #userPhone, .custom-input {

        .form-group { margin-bottom: 18px; }

        .custom-textarea { min-height: 110px; resize: vertical; }
        .radio-group { display: flex; gap: 10px; }
        .radio-group label { flex: 1; }
        .radio-label {
            background: #0a0a0a;
            box-shadow: inset 0 0 0 1px var(--hairline);
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all .4s var(--ease);
            font-size: 0.8rem;

        /* --- RESPONSIVE --- */

        }
    </style>
</head>

                <button class="close-btn" onclick="closeModals()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div id="historyContent" class="panel-content"></div>
        </div>
    </div>

    <!-- Custom Project -->
    <div class="modal-overlay" id="customProjectModal" onclick="closeModals()">
        <div class="sidebar-panel" onclick="event.stopPropagation()">
            <div class="panel-header">
                <h2 data-en="CUSTOM REQUEST" data-ar="مشروع خاص">CUSTOM REQUEST</h2>
                <button class="close-btn" onclick="closeModals()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="panel-content">
                <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:24px;" data-en="Describe your idea. Our team will review and respond." data-ar="اشرح فكرتك. سيراجع فريقنا الطلب ويتواصل معك.">
                    Describe your idea. Our team will review and respond.
                </p>
                <form id="customProjectForm" action="https://formspree.io/f/xnjvkzop" method="POST" onsubmit="handleCustomSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" data-en="Project Details" data-ar="تفاصيل المشروع">Project Details</label>
                        <textarea name="Project_Details" class="custom-input custom-textarea" required placeholder="..." data-en-p="Describe your project..." data-ar-p="اشرح مشروعك..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-en="Phone" data-ar="رقم الهاتف">Phone</label>
                        <input type="tel" name="Phone" class="custom-input" required placeholder="05xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-en="Quality" data-ar="الجودة">Quality</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="Quality" value="Mid" checked>
                                <div class="radio-label" data-en="Mid" data-ar="متوسطة">Mid</div>
                            </label>
                            <label>
                                <input type="radio" name="Quality" value="High">
                                <div class="radio-label" data-en="High" data-ar="عالية">High</div>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-en="Timeline" data-ar="الجدول">Timeline</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="Timeline" value="Soon" checked>
                                <div class="radio-label" data-en="Soon" data-ar="قريباً">Soon</div>
                            </label>
                            <label>
                                <input type="radio" name="Timeline" value="ASAP">
                                <div class="radio-label" data-en="Urgent" data-ar="عاجل">Urgent</div>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-gold" style="margin-top:12px;" data-en="SUBMIT" data-ar="إرسال">SUBMIT</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbAFWhzn9VPihn-P6NlJfTUJw37AhdU-4",
            authDomain: "riyaduino1.firebaseapp.com",
            projectId: "riyaduino1",
            storageBucket: "riyaduino1.firebasestorage.app",
            messagingSenderId: "600860626103",
            appId: "1:600860626103:web:d7e1f2457321abbc789132",
            measurementId: "G-5WTKN1Y1LX"
        };

        const PRODUCTS_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTBQd3LUgZKxeuRQA2B0Cj3IvJBSSS0VL2vnmtOryQxFsAK-Kikg_NZTVGtlYghB96yFYyvqXrPGJEu/pub?output=csv";
        const STATUS_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT6DBal_jf2UrdNIk1CTaIy92As8Jex2UQYPYqkdmWSovDbanvdLiV3BBmnN2B2iGfLpR012Rh4Z3oZ/pub?output=csv";
        const INBOX_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8RKrJTVh6tHKWP7p-f5PtL-g1YdpkOBU1Sqr5_KMivVzh5xfB2SncxEMZncjRdcuMeXavuJnuGdM9/pub?output=csv";

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        

        let currentUser = null, currentLang = 'en', allProducts = [], cart = [];
        let statusMap = {}, oldStatusMap = {}, lastInboxState = "";

        // Nav scroll
        const nav = document.getElementById('mainNav');
        addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 10), { passive: true });

        // Inbox
        async function fetchInbox() {
            if (!currentUser) return;
            return new Promise(resolve => {
                Papa.parse(INBOX_SHEET_URL, {
                    download: true, header: true,
                    complete: (results) => {
                        const myMessages = results.data.filter(row =>
                            row.TargetEmail && row.TargetEmail.trim().toLowerCase() === currentUser.email.toLowerCase()
                        );
                        renderInbox(myMessages);
                        resolve();
                    },
                    error: () => resolve()
                });
            });
        }
        function renderInbox(messages) {
            const str = JSON.stringify(messages);
            if (str === lastInboxState) return;
            lastInboxState = str;
            const container = document.getElementById('inboxContent');
            const badge = document.getElementById('inboxCount');
            if (messages.length) {
                badge.innerText = messages.length;
                badge.style.display = 'block';
            } else badge.style.display = 'none';

            if (!messages.length) {
                container.innerHTML = `<div class="empty-inbox">${currentLang === 'en' ? 'No messages' : 'لا توجد رسائل'}</div>`;
                return;
            }
            container.innerHTML = '';
            [...messages].reverse().forEach(msg => {
                container.innerHTML += `
                    <div class="msg-card unread">
                        <div class="msg-date">${msg.Date || 'Just now'}</div>
                        <div class="msg-title">${msg.Title || ''}</div>
                        <div class="msg-body">${msg.Message || ''}</div>
                    </div>`;
            });
        }

        // Status
        async function fetchStatusSheet() {
            return new Promise(resolve => {
                Papa.parse(STATUS_SHEET_URL, {
                    download: true, header: true,
                    complete: (results) => {
                        const newMap = {};
                        results.data.forEach(row => {
                            if (row.OrderID && row.Status) newMap[row.OrderID.trim()] = row.Status.trim();
                        });
                        Object.keys(newMap).forEach(oid => {
                            const newStatus = newMap[oid];
                            const oldStatus = oldStatusMap[oid];
                            if (oldStatus && oldStatus !== newStatus) {
                                let color = '#fff', msg = '';
                                if (newStatus.toLowerCase().includes('ready')) {
                                    color = '#30d158';
                                    msg = currentLang === 'en' ? 'Order READY · Contact 0543945482' : 'الطلب جاهز · تواصل 0543945482';
                                } else if (newStatus.toLowerCase().includes('cancel')) {
                                    color = '#ff453a';
                                    msg = currentLang === 'en' ? 'Order Cancelled' : 'تم إلغاء الطلب';
                                } else if (newStatus.toLowerCase().includes('under')) {
                                    color = '#ff9f0a';
                                    msg = currentLang === 'en' ? 'Order Under Review' : 'الطلب قيد المراجعة';
                                } else {
                                    msg = currentLang === 'en' ? `Status: ${newStatus}` : `الحالة: ${newStatus}`;
                                }
                                notify(msg, color);
                            }
                        });
                        statusMap = newMap;
                        oldStatusMap = { ...newMap };
                        resolve();
                    },
                    error: () => resolve()
                });
            });
        }

        setInterval(() => {
            if (currentUser) { fetchStatusSheet(); fetchInbox(); }
        }, 10000);

        window.togglePanel = (id) => {
            closeModals();
            document.getElementById(id).classList.add('open');
            document.body.classList.add('modal-open');
            if (id === 'historyModal') fetchStatusSheet().then(() => syncUserData());
            if (id === 'inboxModal') fetchInbox();
        };
        window.closeModals = () => {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
            document.body.classList.remove('modal-open');
        };
        addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.body.classList.toggle('ar', currentLang === 'ar');
            document.body.classList.toggle('en', currentLang === 'en');
            document.documentElement.lang = currentLang;
            document.querySelectorAll('[data-en]').forEach(el => el.innerText = el.getAttribute('data-' + currentLang));
            document.querySelectorAll('[data-en-p]').forEach(el => el.placeholder = el.getAttribute('data-' + currentLang + '-p'));
            if (ready) { buildGrid(); applyFilters(); }
            updateCartUI();
            requestAnimationFrame(moveThumb);
        };

        window.notify = (msg, color = '#FFD700') => {
            const area = document.getElementById('notification-area');
            const t = document.createElement('div');
            t.className = 'notify-toast';
            t.style.borderLeftColor = color;
            t.innerHTML = `<strong style="font-size:0.7rem;letter-spacing:0.06em;">RIYADUINO</strong><br>${msg}`;
            area.appendChild(t);
            setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 450); }, 7000);
        };

        window.handleAuth = async () => {
            if (currentUser) await signOut(auth);
            else await signInWithPopup(auth, provider);
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const avatar = document.getElementById('userAvatar');
            const authBtn = document.getElementById('googleAuthBtn');
            if (user) {
                avatar.src = user.photoURL;
                avatar.style.display = 'block';
                authBtn.style.display = 'none';
                await syncUserData();
            } else {
                avatar.style.display = 'none';
                authBtn.style.display = 'flex';
                cart = [];
                updateCartUI();
            }
        });

        async function syncUserData() {
            const ref = doc(db, 'users', currentUser.uid);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                cart = snap.data().cart || [];
                await fetchStatusSheet();
                await fetchInbox();
                renderHistory(snap.data().history || []);
                await updateDoc(ref, { email: currentUser.email });
            } else {
                await setDoc(ref, { cart: [], history: [], email: currentUser.email });
            }
            updateCartUI();
        }

        // =====================================================================
        // Catalog: category tabs, search, sheet-driven filter chips, stock badges
        // Sheet columns used: name, price, image, category, instock, description,
        //   lowstock  -> TRUE (or a number) shows the yellow "low stock" badge
        //   filter / filter_ar -> optional sub-filter chips (English / Arabic label)
        // =====================================================================
        const $ = (s, r = document) => r.querySelector(s);
        const T = (en, ar) => currentLang === 'en' ? en : ar;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const norm = s => String(s ?? '').toLowerCase().normalize('NFKD')
            .replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
        const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
        const EASE = 'cubic-bezier(.22,1,.36,1)';

        const grid = $('#productsGrid');
        const state = { cat: 'pieces', filter: 'all', q: '' };
        let ready = false, chipSig = '';

        const truthy = v => ['true', 'yes', 'y', '1'].includes(String(v ?? '').trim().toLowerCase());
        const catOf = p => String(p.category || 'pieces').trim().toLowerCase();
        const fKey = p => norm(p.filter || p.filterar || '');
        const fLabel = p => String((currentLang === 'ar' ? (p.filterar || p.filter) : (p.filter || p.filterar)) || '').trim();

        function stock(p) {
            const inRaw = String(p.instock ?? '').trim();
            if (inRaw && !truthy(inRaw)) return { state: 'out' };
            const low = String(p.lowstock ?? '').trim();
            if (/^\d+$/.test(low)) return +low > 0 ? { state: 'low', left: +low } : { state: 'in' };
            if (truthy(low) || ['low', 'lowstock'].includes(low.toLowerCase())) return { state: 'low' };
            return { state: 'in' };
        }
        const lowText = st => st.left ? T(`ONLY ${st.left} LEFT`, `متبقي ${st.left} فقط`) : T('LOW STOCK', 'كمية محدودة');

        function cardHTML(p, idx) {
            const st = stock(p);
            const cls = 'product-card' + (st.state === 'out' ? ' out-of-stock-card' : '') + (st.state === 'low' ? ' low-stock-card' : '');
            let badge = '';
            if (st.state === 'out') badge = `<div class="badge-stock badge-out">${T('OUT OF STOCK', 'نفذت')}</div>`;
            else if (st.state === 'low') badge = `<div class="badge-stock badge-low"><i></i>${lowText(st)}</div>`;
            const fl = fLabel(p);
            const search = norm([p.name, p.description, p.filter, p.filterar].join(' '));
            return `
                <article class="${cls}" data-idx="${idx}" data-f="${esc(fKey(p))}" data-s="${esc(search)}" tabindex="${st.state === 'out' ? -1 : 0}"
                         onclick="openProduct(${idx})" onkeydown="if(event.key==='Enter')openProduct(${idx})">
                    ${badge}
                    <div class="img-box"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onload="this.classList.add('ld')" onerror="this.classList.add('ld','err')"></div>
                    <div class="p-info">
                        <div class="p-title">${esc(p.name)}</div>
                        <div class="p-meta"><span class="p-price">${esc(p.price)}</span>${fl ? `<span class="p-tag">${esc(fl)}</span>` : ''}</div>
                    </div>
                </article>`;
        }

        // scroll reveal (staggered per batch)
        const io = new IntersectionObserver(entries => {
            let n = 0;
            entries.forEach(e => {
                if (!e.isIntersecting) return;
                const c = e.target; io.unobserve(c);
                if (c.classList.contains('in')) return;
                c.style.setProperty('--d', Math.min(n++, 10) * 0.05 + 's');
                c.classList.add('in', 'reveal');
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

        // FLIP: cards glide to their new place when filters change
        function flip(change) {
            if (reduced) return change();
            const cards = [...grid.querySelectorAll('.product-card')];
            const first = new Map(cards.map(c => [c, c.hidden ? null : c.getBoundingClientRect()]));
            change();
            cards.forEach(c => {
                if (c.hidden) return;
                const f = first.get(c), l = c.getBoundingClientRect();
                if (!f) {
                    c.classList.add('in'); io.unobserve(c);
                    c.animate([{ opacity: 0, transform: 'translateY(14px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 500, easing: EASE });
                } else {
                    const dx = f.left - l.left, dy = f.top - l.top;
                    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) c.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 600, easing: EASE });
                }
            });
        }

        function updateCounts() {
            ['pieces', 'projects'].forEach(c => { $('#cnt-' + c).textContent = allProducts.filter(p => p.name && catOf(p) === c).length; });
        }

        function buildGrid() {
            updateCounts();
            const items = allProducts.map((p, idx) => ({ p, idx })).filter(({ p }) => p.name && catOf(p) === state.cat);
            grid.innerHTML = items.map(({ p, idx }) => cardHTML(p, idx)).join('');
            grid.querySelectorAll('.product-card').forEach(c => io.observe(c));
            chipSig = '';
        }

        function renderChips(groups, total) {
            const wrap = $('#chipsWrap'), box = $('#chips');
            const keys = [...groups.keys()];
            const show = keys.length >= 2;
            wrap.classList.toggle('show', show);
            wrap.firstElementChild.inert = !show;
            if (!show) { chipSig = ''; return; }
            const sig = currentLang + '|' + keys.join('|');
            if (sig !== chipSig) {
                chipSig = sig;
                box.innerHTML = `<button class="chip" data-k="all"><span>${T('All', 'الكل')}</span><i></i></button>` +
                    keys.map(k => `<button class="chip" data-k="${esc(k)}"><span>${esc(groups.get(k).label)}</span><i></i></button>`).join('');
            }
            box.querySelectorAll('.chip').forEach(b => {
                const k = b.dataset.k, n = k === 'all' ? total : (groups.get(k)?.n ?? 0);
                b.querySelector('i').textContent = n;
                b.setAttribute('aria-pressed', String(state.filter === k));
                b.classList.toggle('zero', n === 0);
            });
        }

        function applyFilters() {
            const q = norm(state.q);
            const groups = new Map();
            let matchQ = 0, shown = 0;
            grid.querySelectorAll('.product-card').forEach(c => {
                const p = allProducts[+c.dataset.idx], k = c.dataset.f;
                const okQ = !q || c.dataset.s.includes(q);
                if (k) { const g = groups.get(k) || { label: fLabel(p), n: 0 }; if (okQ) g.n++; groups.set(k, g); }
                if (okQ) matchQ++;
                const vis = okQ && (state.filter === 'all' || k === state.filter);
                c.hidden = !vis;
                if (vis) shown++;
            });
            renderChips(groups, matchQ);
            $('#resultCount').textContent = ready ? `${shown} ${T(shown === 1 ? 'product' : 'products', 'منتج')}` : '';
            $('#clearFilters').hidden = state.filter === 'all' && !state.q;
            $('#emptyState').hidden = !(ready && shown === 0);
        }

        // chips
        $('#chips').addEventListener('click', e => {
            const b = e.target.closest('.chip'); if (!b) return;
            const k = b.dataset.k;
            state.filter = (k === state.filter && k !== 'all') ? 'all' : k;
            flip(applyFilters);
        });

        // search
        const input = $('#searchInput'), clearBtn = $('#searchClear');
        let searchTimer;
        input.addEventListener('input', () => {
            clearBtn.classList.toggle('show', !!input.value);
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { state.q = input.value; flip(applyFilters); }, 140);
        });
        clearBtn.addEventListener('click', () => {
            input.value = ''; clearBtn.classList.remove('show');
            state.q = ''; flip(applyFilters); input.focus();
        });
        window.clearFilters = () => {
            state.filter = 'all'; state.q = ''; input.value = ''; clearBtn.classList.remove('show');
            flip(applyFilters);
        };

        // category tabs with a sliding thumb
        const seg = $('#catSeg'), thumb = $('#segThumb');
        function moveThumb() {
            const a = seg.querySelector('[aria-selected="true"]'); if (!a) return;
            thumb.style.width = a.offsetWidth + 'px';
            thumb.style.transform = `translateX(${a.offsetLeft}px)`;
        }
        function syncSeg() {
            seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.cat === state.cat)));
            moveThumb();
        }
        function setCategory(cat, push = true) {
            if (cat === state.cat) return;
            state.cat = cat; state.filter = 'all';
            syncSeg();
            if (push) history.replaceState(null, '', cat === 'projects' ? '#projects' : location.pathname + location.search);
            if (!ready) return;
            grid.classList.add('swap');
            setTimeout(() => { buildGrid(); applyFilters(); grid.classList.remove('swap'); }, reduced ? 0 : 230);
        }
        seg.addEventListener('click', e => { const b = e.target.closest('button[data-cat]'); if (b) setCategory(b.dataset.cat); });
        const hashCat = () => location.hash.replace('#', '').toLowerCase() === 'projects' ? 'projects' : null;
        addEventListener('hashchange', () => setCategory(hashCat() || 'pieces', false));
        state.cat = hashCat() || 'pieces';
        thumb.style.transition = 'none';
        syncSeg();
        new ResizeObserver(moveThumb).observe(seg);
        requestAnimationFrame(() => requestAnimationFrame(() => { thumb.style.transition = ''; }));

        // load products from the sheet
        window.loadProducts = () => {
            $('#errorState').hidden = true; $('#emptyState').hidden = true;
            grid.innerHTML = Array.from({ length: 8 }, () => '<div class="skel"></div>').join('');
            Papa.parse(PRODUCTS_SHEET_URL, {
                download: true, header: true,
                transformHeader: h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ''),
                complete: (res) => { allProducts = res.data; ready = true; buildGrid(); applyFilters(); },
                error: () => { grid.innerHTML = ''; $('#errorState').hidden = false; }
            });
        };
        loadProducts();

        window.openProduct = (idx) => {
            const p = allProducts[idx], st = stock(p);
            if (st.state === 'out') return notify(T('Out of stock', 'نفذت الكمية'), '#ff453a');
            document.getElementById('modalImg').src = p.image;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = p.price;
            document.getElementById('modalDesc').innerText = p.description || '—';
            const note = document.getElementById('modalStock');
            note.hidden = st.state !== 'low';
            if (st.state === 'low') note.innerHTML = `<i></i>${st.left ? T(`Only ${st.left} left in stock`, `متبقي ${st.left} فقط في المخزون`) : T('Low stock, order soon', 'الكمية محدودة، اطلب قريباً')}`;
            document.getElementById('productModal').classList.add('open');
            document.body.classList.add('modal-open');
            document.getElementById('modalAddBtn').onclick = () => addToCart(idx);
        };

        window.addToCart = (idx) => {
            if (!currentUser) return handleAuth();
            const p = allProducts[idx];
            let pNum = parseFloat(String(p.price).replace(/[^0-9.]/g, '')) || 0;
            const ex = cart.find(i => i.idx === idx);
            if (ex) ex.qty++;
            else cart.push({ idx, name: p.name, price: pNum, qty: 1, img: p.image });
            updateCartUI();
            updateDoc(doc(db, 'users', currentUser.uid), { cart });
            closeModals();
            notify(currentLang === 'en' ? 'Added to cart' : 'تمت الإضافة', '#FFD700');
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cartItemsList');
            let total = 0;
            list.innerHTML = cart.length ? cart.map((item, i) => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <img src="${item.img}" alt="">
                        <div style="flex:1">
                            <div style="font-size:0.88rem;font-weight:600;">${item.name}</div>
                            <div class="qty-ctrl">
                                <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
                                <span style="font-size:0.8rem;font-family:var(--font-mono)">${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
                            </div>
                        </div>
                        <div style="color:var(--gold);font-weight:600;font-family:var(--font-mono);font-size:0.9rem;">$${(item.price * item.qty).toFixed(2)}</div>
                    </div>`;
            }).join('') : `<div style="text-align:center;padding:48px;color:var(--text-tertiary);font-size:0.9rem;">${currentLang === 'en' ? 'Cart is empty' : 'السلة فارغة'}</div>`;
            document.getElementById('cartTotalDisplay').innerText = '$' + total.toFixed(2);
            const countEl = document.getElementById('cartCount');
            const n = cart.reduce((a, b) => a + b.qty, 0);
            if (+countEl.innerText !== n) {
                countEl.innerText = n;
                countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');
            }
        };

        window.changeQty = (i, d) => {
            cart[i].qty += d;
            if (cart[i].qty <= 0) cart.splice(i, 1);
            updateCartUI();
            if (currentUser) updateDoc(doc(db, 'users', currentUser.uid), { cart });
        };

        window.validateAndSubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return handleAuth();
            if (!cart.length) return;
            const sec = document.getElementById('phoneInputSection');
            const ph = document.getElementById('userPhone');
            if (sec.style.display === 'none') {
                sec.style.display = 'block';
                ph.focus();
                return notify(currentLang === 'en' ? 'Enter your phone number' : 'أدخل رقم هاتفك', '#ff9f0a');
            }
            const phoneRegex = /^(05|5|\+966|00966)[0-9]{8,11}$/;
            if (!phoneRegex.test(ph.value.replace(/\s/g, ''))) {
                ph.style.borderColor = 'var(--danger)';
                return;
            }
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerText = '…';
            const orderStr = cart.map(i => `${i.name} x${i.qty}`).join(' | ') ;
            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('hiddenOrderData').value = `[ID: ${orderId}]\n${orderStr}`;
            document.getElementById('hiddenUserEmail').value = currentUser.email;
            document.getElementById('hiddenUserPhone').value = ph.value;
            try {
                const res = await fetch(e.target.action, { method: 'POST', body: new FormData(e.target), headers: { 'Accept': 'application/json' } });
                if (res.ok) {
                    const newOrder = { id: orderId, date: new Date().toLocaleString(), details: orderStr };
                    await updateDoc(doc(db, 'users', currentUser.uid), { history: arrayUnion(newOrder), cart: [] });
                    notify(currentLang === 'en' ? 'Order placed successfully' : 'تم تسجيل الطلب بنجاح', '#30d158');
                    cart = [];
                    updateCartUI();
                    closeModals();
                    ph.value = '';
                    sec.style.display = 'none';
                    syncUserData();
                }
            } catch {
                notify('Error', '#ff453a');
            } finally {
                btn.disabled = false;
                btn.innerText = currentLang === 'en' ? 'CHECKOUT' : 'إتمام الشراء';
            }
        };

        window.openCustomRequest = () => {
            if (!currentUser) {
                notify(currentLang === 'en' ? 'Sign in to submit a request' : 'سجّل الدخول لتقديم طلب', '#ff9f0a');
                handleAuth();
                return;
            }
            togglePanel('customProjectModal');
        };

        window.handleCustomSubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const ph = e.target.querySelector('input[name="Phone"]');
            const phoneRegex = /^(05|5|\+966|00966)[0-9]{8,11}$/;
            if (!phoneRegex.test(ph.value.replace(/\s/g, ''))) {
                notify(currentLang === 'en' ? 'Enter a valid Saudi mobile' : 'أدخل رقم جوال سعودي صحيح', '#ff453a');
                ph.style.borderColor = 'var(--danger)';
                ph.focus();
                return;
            }
            ph.style.borderColor = '';
            const original = btn.innerText;
            btn.disabled = true;
            btn.innerText = '…';
            if (currentUser) {
                const hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = 'User_Email';
                hidden.value = currentUser.email;
                e.target.appendChild(hidden);
            }
            try {
                const res = await fetch(e.target.action, {
                    method: 'POST',
                    body: new FormData(e.target),
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    closeModals();
                    e.target.reset();
                    notify(currentLang === 'en'
                        ? 'Request received. Our team will contact you shortly.'
                        : 'تم استلام الطلب. سيتواصل فريقنا معك قريباً.', '#30d158');
                } else notify(currentLang === 'en' ? 'Submission failed' : 'فشل الإرسال', '#ff453a');
            } catch {
                notify('Network error', '#ff453a');
            } finally {
                btn.disabled = false;
                btn.innerText = original;
            }
        };

        function renderHistory(h) {
            const c = document.getElementById('historyContent');
            c.innerHTML = h.length ? '' : `<p style="text-align:center;color:var(--text-tertiary);padding:40px 0;">${currentLang === 'en' ? 'No orders yet' : 'لا توجد طلبات'}</p>`;
            [...h].reverse().forEach(o => {
                const id = o.id || 'OLD';
                const details = typeof o === 'string' ? o : o.details;
                const date = o.date || '—';
                let status = statusMap[id] || 'Processing';
                let color = 'var(--text-tertiary)';
                let extra = '';
                if (status.toLowerCase().includes('ready')) {
                    color = '#30d158';
                    extra = `<div class="contact-info"><strong>READY</strong><br>0543945482<br><a href="https://www.google.com/maps/place/RIYADUINO/@24.7060923,46.7417012,21z" target="_blank">Location</a></div>`;
                } else if (status.toLowerCase().includes('under')) color = '#ff9f0a';
                else if (status.toLowerCase().includes('cancel')) color = '#ff453a';
                c.innerHTML += `
                    <div class="history-card" style="border-left:3px solid ${color}">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <div class="history-date">${date}</div>
                            <div style="color:${color};font-size:0.6rem;border:1px solid ${color};padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:0.04em;font-family:var(--font-mono);">${status.toUpperCase()}</div>
                        </div>
                        <div style="font-size:0.8rem;color:var(--text-secondary);">${details}</div>
                        ${extra}
                    </div>`;
            });
        }

        // Cursor glow
        const glow = document.getElementById('cursorGlow');
        let gx = 0, gy = 0, tx = 0, ty = 0;
        document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
        (function animateGlow() {
            gx += (tx - gx) * 0.12;
            gy += (ty - gy) * 0.12;
            if (glow) { glow.style.left = gx + 'px'; glow.style.top = gy + 'px'; }
            requestAnimationFrame(animateGlow);
        })();
    

        // Spotlight on product cards
        grid.addEventListener('pointermove', e => {
            const c = e.target.closest('.product-card'); if (!c) return;
            const r = c.getBoundingClientRect();
            c.style.setProperty('--mx', e.clientX - r.left + 'px');
            c.style.setProperty('--my', e.clientY - r.top + 'px');
        });

        // Magnetic buttons
        if (matchMedia('(hover:hover)').matches && !reduced) {
            document.querySelectorAll('.store-head .gbtn,.btn-gold').forEach(b => {
                b.addEventListener('pointermove', e => {
                    if (e.pointerType !== 'mouse') return;
                    const r = b.getBoundingClientRect();
                    b.style.setProperty('--tx', (e.clientX - r.left - r.width / 2) * .14 + 'px');
                    b.style.setProperty('--ty', (e.clientY - r.top - r.height / 2) * .24 + 'px');
                });
                b.addEventListener('pointerleave', () => { b.style.setProperty('--tx', '0px'); b.style.setProperty('--ty', '0px'); });
            });
        }

        // Fade out when going back to the landing page
        document.addEventListener('click', e => {
            const a = e.target.closest('a[href="index.html"]');
            if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || reduced) return;
            e.preventDefault();
            document.body.classList.add('leaving');
            setTimeout(() => { location.href = 'index.html'; }, 340);
        });
        addEventListener('pageshow', () => document.body.classList.remove('leaving'));

    </script>
</body>
</html>
